name: Deploy experiment demos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build both demos
        run: |
          for experiment in norming main-experiment; do
            (cd experiments/$experiment && pnpm install --frozen-lockfile && pnpm test && pnpm build)
            mkdir -p site/$experiment
            cp -R experiments/$experiment/dist/. site/$experiment/
          done
      - uses: actions/configure-pages@v6
        if: vars.ENABLE_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: vars.ENABLE_PAGES == 'true'
        with:
          path: site
  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
